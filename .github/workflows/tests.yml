name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5', '8.6' ]

    continue-on-error: ${{ matrix.php == '8.6' }}
                
    steps:
      - uses: actions/checkout@v7

      - name: Use PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit

      - name: Use Node.js
        uses: actions/setup-node@v7

      - name: Test
        run: phpunit --configuration phpunit.xml.dist
